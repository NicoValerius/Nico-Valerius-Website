<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum – Nico Valerius</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  :root { --bg:#F5F5F7; --surface:#FFFFFF; --text:#1D1D1F; --secondary:#6E6E73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#1C1C1E; --text:#F5F5F7; --secondary:#98989D; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 22px; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55; }
  main { max-width:560px; margin:0 auto; }
  .back { display:inline-block; margin-bottom:28px; color:var(--secondary); text-decoration:none; font-size:0.9375rem; }
  .back:hover { text-decoration:underline; }
  h1 { margin:0 0 24px; font-size:2rem; font-weight:600; letter-spacing:-0.025em; }
  .card { background:var(--surface); border-radius:14px; padding:22px 20px; }
  h2 { margin:22px 0 6px; font-size:1.0625rem; font-weight:600; }
  h2:first-child { margin-top:0; }
  p, li { margin:0 0 8px; font-size:0.9688rem; }
  ul { margin:0 0 8px; padding-left:20px; }
  a { color:inherit; }
  a:focus-visible { outline:2px solid #0071E3; outline-offset:2px; border-radius:3px; }
  .stand { margin-top:18px; color:var(--secondary); font-size:0.8125rem; text-align:center; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">‹ Zurück</a>
  <h1>Impressum</h1>
  <div class="card">
    <h2>Angaben gemäß § 5 DDG</h2>
    <p>Nico Valerius<br>
    c/o [NAME DES ADRESSDIENSTS]<br>
    [STRASSE HAUSNUMMER]<br>
    [PLZ ORT]<br>
    Deutschland</p>

    <h2>Kontakt</h2>
    <p>E-Mail: <a href="mailto:kontakt@nicovalerius.com">kontakt@nicovalerius.com</a></p>
    <!-- Empfohlen: zweiter schneller Kontaktweg (z. B. Zweitnummer) -->
    <!-- <p>Telefon: [NUMMER]</p> -->

    <!-- Nur einfügen, sobald du eine hast (USt-IdNr. ODER Wirtschafts-IdNr.): -->
    <!-- <h2>Umsatzsteuer-ID</h2><p>[DE123456789]</p> -->
    <!-- <h2>Wirtschafts-ID</h2><p>[DE123456789-00001]</p> -->

    <h2>Geltungsbereich</h2>
    <p>Dieses Impressum gilt auch für meine Profile auf Instagram und TikTok.</p>
  </div>
  <p class="stand">Stand: November 2026</p>
</main>
</body>
</html>
